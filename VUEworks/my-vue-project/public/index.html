  <!--
    第三方访问统计（51.la）。它会请求外部域名并上报访客数据，

    如需论文中的访问量统计，取消下面几行注释即可；答辩演示建议保持注释状态。
  <script charset="UTF-8" id="LA_COLLECT" src="https://sdk.51.la/js-sdk-pro.min.js"></script>
  <script>
    LA.init({ id: "3LsLCdTDFY7Qh6u4", ck: "3LsLCdTDFY7Qh6u4" });
  </script>
  -->

  <!-- Markdown 渲染：本地依赖（public/vendor/marked.min.js，v15.0.7，与 package.json 一致），离线可用 -->
  <script src="/vendor/marked.min.js"></script>
  <!-- MathJax 配置：本地依赖，改用 SVG 输出，无需再联网加载字体文件 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script src="/vendor/mathjax/tex-mml-svg.js"></script>
